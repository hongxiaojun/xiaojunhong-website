<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <!-- Background -->
  <rect width="900" height="500" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#343a40">
    三大核心机制
  </text>
  <text x="450" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#6c757d">
    分别解决三个问题
  </text>

  <!-- Mechanism 1: 持久化上下文 -->
  <g transform="translate(150, 200)">
    <!-- Shield background -->
    <path d="M0,-80 C0,-80 70,-80 70,-80 C70,-40 70,40 35,80 C0,40 0,40 0,-40 C0,-80 0,-80 0,-80 Z"
          fill="#d4edda" stroke="#28a745" stroke-width="3"/>
    <!-- Icon: Document with pin -->
    <g transform="translate(35, 0)">
      <rect x="-25" y="-35" width="50" height="60" rx="3" fill="#fff" stroke="#28a745" stroke-width="2"/>
      <line x1="-15" y1="-20" x2="15" y2="-20" stroke="#28a745" stroke-width="2"/>
      <line x1="-15" y1="-8" x2="15" y2="-8" stroke="#28a745" stroke-width="2"/>
      <line x1="-15" y1="4" x2="5" y2="4" stroke="#28a745" stroke-width="2"/>
      <!-- Pin -->
      <circle cx="0" cy="45" r="8" fill="#dc3545"/>
      <line x1="0" y1="37" x2="0" y2="25" stroke="#dc3545" stroke-width="2"/>
    </g>
    <!-- Title -->
    <text x="35" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#343a40">
      持久化上下文
    </text>
    <!-- Problem solved -->
    <rect x="-45" y="135" width="160" height="50" rx="5" fill="#e9ecef"/>
    <text x="35" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#495057">
      解决"AI 忘了"
    </text>
    <text x="35" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6c757d">
      CLAUDE.md 持久化
    </text>
  </g>

  <!-- Mechanism 2: 决策代理 -->
  <g transform="translate(450, 200)">
    <!-- Shield background -->
    <path d="M0,-80 C0,-80 70,-80 70,-80 C70,-40 70,40 35,80 C0,40 0,40 0,-40 C0,-80 0,-80 0,-80 Z"
          fill="#cfe5ff" stroke="#007bff" stroke-width="3"/>
    <!-- Icon: AI brain with decision -->
    <g transform="translate(35, 0)">
      <!-- Brain outline -->
      <ellipse rx="28" ry="25" fill="none" stroke="#007bff" stroke-width="2"/>
      <!-- Brain waves -->
      <path d="M-15,-5 Q-8,-15 0,-5 Q8,5 15,-5" fill="none" stroke="#007bff" stroke-width="2"/>
      <path d="M-15,8 Q-8,-2 0,8 Q8,18 15,8" fill="none" stroke="#007bff" stroke-width="2"/>
      <!-- Checkmark -->
      <circle cx="0" cy="40" r="12" fill="#28a745"/>
      <path d="M-5,40 L-2,43 L5,36" fill="none" stroke="#fff" stroke-width="2"/>
    </g>
    <!-- Title -->
    <text x="35" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#343a40">
      决策代理
    </text>
    <!-- Problem solved -->
    <rect x="-45" y="135" width="160" height="50" rx="5" fill="#e9ecef"/>
    <text x="35" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#495057">
      解决"选择题烦恼"
    </text>
    <text x="35" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6c757d">
      让外部 AI 裁决
    </text>
  </g>

  <!-- Mechanism 3: 11阶段工作流 -->
  <g transform="translate(750, 200)">
    <!-- Shield background -->
    <path d="M0,-80 C0,-80 70,-80 70,-80 C70,-40 70,40 35,80 C0,40 0,40 0,-40 C0,-80 0,-80 0,-80 Z"
          fill="#e2d5f0" stroke="#6f42c1" stroke-width="3"/>
    <!-- Icon: Workflow steps -->
    <g transform="translate(35, 0)">
      <!-- Step circles -->
      <circle cx="-20" cy="-15" r="10" fill="#6f42c1"/>
      <text x="-20" y="-11" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#fff">1</text>
      <circle cx="0" cy="-15" r="10" fill="#6f42c1"/>
      <text x="0" y="-11" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#fff">2</text>
      <circle cx="20" cy="-15" r="10" fill="#6f42c1"/>
      <text x="20" y="-11" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#fff">3</text>
      <!-- Connecting arrows -->
      <path d="M-8,-15 L-12,-15" stroke="#6f42c1" stroke-width="2"/>
      <path d="M12,-15 L8,-15" stroke="#6f42c1" stroke-width="2"/>
      <!-- Flag/finish -->
      <path d="M0,10 L0,35 M0,10 L20,20 L0,30" stroke="#6f42c1" stroke-width="2" fill="none"/>
    </g>
    <!-- Title -->
    <text x="35" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#343a40">
      11 阶段工作流
    </text>
    <!-- Problem solved -->
    <rect x="-45" y="135" width="160" height="50" rx="5" fill="#e9ecef"/>
    <text x="35" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#495057">
      解决"没方向"
    </text>
    <text x="35" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6c757d">
      完整方法论
    </text>
  </g>

  <!-- Bottom connecting insight -->
  <g transform="translate(450, 420)">
    <rect x="-250" y="-30" width="500" height="60" rx="10" fill="#343a40"/>
    <text x="0" y="-5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#fff" font-weight="bold">
      核心洞察：先完成再完美
    </text>
    <text x="0" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#adb5bd">
      新手做新项目，不该在选型上浪费时间
    </text>
  </g>
</svg>