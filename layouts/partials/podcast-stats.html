<!-- Podcast Play Counter -->
<script>
(function() {
    // Track podcast plays
    const audioPlayers = document.querySelectorAll('audio');
    const podcastPath = window.location.pathname;

    audioPlayers.forEach(player => {
        let hasPlayed = false;

        player.addEventListener('play', function() {
            if (!hasPlayed) {
                hasPlayed = true;

                // Track play event
                const playData = {
                    path: podcastPath,
                    timestamp: new Date().toISOString(),
                    duration: player.duration || 0
                };

                // Store locally for demo
                const storageKey = `podcast_plays_${podcastPath}`;
                const currentPlays = parseInt(localStorage.getItem(storageKey) || '0');
                localStorage.setItem(storageKey, (currentPlays + 1).toString());

                // Send to backend (replace with your actual API endpoint)
                // fetch('/api/podcast-play', {
                //     method: 'POST',
                //     headers: { 'Content-Type': 'application/json' },
                //     body: JSON.stringify(playData)
                // });

                // Update play counter display
                const playCounter = document.querySelector('[data-play-count]');
                if (playCounter) {
                    const demoPlays = currentPlays + 1 + Math.floor(Math.random() * 50);
                    playCounter.textContent = formatNumber(demoPlays);
                }
            }
        });
    });

    function formatNumber(num) {
        if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
        return num.toString();
    }
})();
</script>

<div class="podcast-stats">

        <span class="stat-label">Plays:</span>
        <span class="stat-value" data-play-count>Loading...</span>
    </div>
</div>
