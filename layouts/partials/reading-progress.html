<!-- Reading Progress Bar -->
<div class="reading-progress" id="reading-progress">
  <div class="progress-bar" id="progress-bar"></div>
</div>

<style>
.reading-progress {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 3px;
  background: transparent;
  z-index: 1000;
  pointer-events: none;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--brand) 0%, var(--brand-light) 100%);
  width: 0%;
  transition: width 0.1s ease-out;
  box-shadow: 0 0 10px rgba(27, 54, 93, 0.3);
}

/* Hide progress bar on pages where it's not needed */
.reading-progress.hidden {
  display: none;
}

/* Make progress bar more visible on scroll */
.reading-progress.visible .progress-bar {
  background: linear-gradient(90deg, var(--brand) 0%, var(--brand-light) 100%);
}

/* Adjust for mobile */
@media (max-width: 768px) {
  .reading-progress {
    height: 4px;
  }
}
</style>

<script>
(function() {
  'use strict';

  // Only show progress bar on article pages
  const articleContent = document.querySelector('.article-content, .content, main article');
  const progressBar = document.getElementById('progress-bar');
  const readingProgress = document.getElementById('reading-progress');

  if (!articleContent || !progressBar || !readingProgress) {
    return;
  }

  // Calculate reading progress
  function updateProgress() {
    const windowHeight = window.innerHeight;
    const documentHeight = document.documentElement.scrollHeight;
    const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
    const clientHeight = document.documentElement.clientHeight;

    // Calculate how much of the article has been read
    const articleTop = articleContent.offsetTop;
    const articleHeight = articleContent.offsetHeight;
    const articleBottom = articleTop + articleHeight;

    // Don't show progress bar until we reach the article
    if (scrollTop < articleTop - windowHeight) {
      readingProgress.classList.add('hidden');
      return;
    } else {
      readingProgress.classList.remove('hidden');
    }

    // Calculate progress within the article
    let progress = 0;
    const scrollPosition = scrollTop + windowHeight;

    if (scrollPosition <= articleTop) {
      progress = 0;
    } else if (scrollPosition >= articleBottom) {
      progress = 100;
    } else {
      const readAmount = scrollPosition - articleTop;
      progress = (readAmount / articleHeight) * 100;
    }

    // Update progress bar width
    progressBar.style.width = Math.min(100, Math.max(0, progress)) + '%';

    // Add visibility class when user starts reading
    if (progress > 0) {
      readingProgress.classList.add('visible');
    }
  }

  // Throttle scroll events for performance
  let ticking = false;
  function onScroll() {
    if (!ticking) {
      window.requestAnimationFrame(function() {
        updateProgress();
        ticking = false;
      });
      ticking = true;
    }
  }

  // Listen for scroll events
  window.addEventListener('scroll', onScroll, { passive: true });

  // Update on resize
  window.addEventListener('resize', onScroll, { passive: true });

  // Initial update
  updateProgress();

})();
</script>
