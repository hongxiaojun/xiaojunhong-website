<!-- Website Visitor Statistics -->
<div class="visitor-stats">
    <div class="stats-header">
        <h3>📊 Statistics</h3>
    </div>

    <div class="stats-grid">
        <div class="stat-item">
            <span class="stat-icon">👥</span>
            <div class="stat-content">
                <div class="stat-number" data-total-visitors>Loading...</div>
                <div class="stat-label">Visitors</div>
            </div>
        </div>

        <div class="stat-item">
            <span class="stat-icon">📖</span>
            <div class="stat-content">
                <div class="stat-number" data-total-views>Loading...</div>
                <div class="stat-label">Views</div>
            </div>
        </div>

        <div class="stat-item">
            <span class="stat-icon">🎙️</span>
            <div class="stat-content">
                <div class="stat-number" data-total-plays>Loading...</div>
                <div class="stat-label">Plays</div>
            </div>
        </div>
    </div>
</div>

<style>
.visitor-stats {
    background: var(--color-bg-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin: 32px 0;
}

.stats-header {
    text-align: center;
    margin-bottom: 16px;
}

.stats-header h3 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    color: var(--color-text);
}

.stats-grid {
    display: flex;
    justify-content: center;
    gap: 48px;
    flex-wrap: wrap;
}

.stat-item {
    display: flex;
    align-items: center;
    gap: 8px;
}

.stat-icon {
    font-size: 20px;
    line-height: 1;
}

.stat-content {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.stat-number {
    font-size: 18px;
    font-weight: 700;
    color: var(--color-accent);
    line-height: 1;
}

.stat-label {
    font-size: 11px;
    color: var(--color-text-light);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

@media (max-width: 768px) {
    .visitor-stats {
        padding: 16px;
        margin: 24px 0;
    }

    .stats-header h3 {
        font-size: 14px;
    }

    .stats-grid {
        gap: 24px;
    }

    .stat-item {
        gap: 6px;
    }

    .stat-icon {
        font-size: 18px;
    }

    .stat-number {
        font-size: 16px;
    }

    .stat-label {
        font-size: 10px;
    }
}
</style>

<script>
(function() {
    // Simulated statistics (replace with real API calls)
    function generateStats() {
        // Generate some realistic-looking numbers
        const baseVisitors = 1250;
        const baseViews = 4500;
        const basePlays = 890;

        // Add some randomness
        const visitors = baseVisitors + Math.floor(Math.random() * 100);
        const views = baseViews + Math.floor(Math.random() * 200);
        const plays = basePlays + Math.floor(Math.random() * 50);

        // Calculate days online (since January 1, 2026)
        const startDate = new Date('2026-01-01');
        const today = new Date();
        const daysOnline = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));

        return { visitors, views, plays, daysOnline };
    }

    function formatNumber(num) {
        if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
        return num.toString();
    }

    function updateStats() {
        const stats = generateStats();

        // Update all stat elements
        const visitorsEl = document.querySelector('[data-total-visitors]');
        const viewsEl = document.querySelector('[data-total-views]');
        const playsEl = document.querySelector('[data-total-plays]');
        const daysEl = document.querySelector('[data-active-days]');

        if (visitorsEl) visitorsEl.textContent = formatNumber(stats.visitors);
        if (viewsEl) viewsEl.textContent = formatNumber(stats.views);
        if (playsEl) playsEl.textContent = formatNumber(stats.plays);
        if (daysEl) daysEl.textContent = stats.daysOnline;
    }

    // Update stats immediately and then every 30 seconds
    updateStats();
    setInterval(updateStats, 30000);

    // Store page view for session tracking
    const sessionKey = 'visitor_session';
    if (!sessionStorage.getItem(sessionKey)) {
        sessionStorage.setItem(sessionKey, 'true');

        // Increment total visitors (local storage for demo)
        const totalVisitors = parseInt(localStorage.getItem('total_visitors') || '0');
        localStorage.setItem('total_visitors', (totalVisitors + 1).toString());
    }
})();
</script>
