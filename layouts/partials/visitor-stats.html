<!-- Website Visitor Statistics -->
<div class="visitor-stats">
    <div class="stats-header">
        <h3>📊 Statistics</h3>
    </div>

    <div class="stats-grid">
        <div class="stat-item">
            <span class="stat-icon">👥</span>
            <div class="stat-content">
                <div class="stat-number" data-total-visitors>Loading...</div>
                <div class="stat-label">Visitors</div>
            </div>
        </div>

        <div class="stat-item">
            <span class="stat-icon">📖</span>
            <div class="stat-content">
                <div class="stat-number" data-total-views>Loading...</div>
                <div class="stat-label">Views</div>
            </div>
        </div>

        <div class="stat-item">
            <span class="stat-icon">🎙️</span>
            <div class="stat-content">
                <div class="stat-number" data-total-plays>Loading...</div>
                <div class="stat-label">Plays</div>
            </div>
        </div>
    </div>
</div>

<style>
.visitor-stats {
    background: var(--color-bg-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin: 32px 0;
}

.stats-header {
    text-align: center;
    margin-bottom: 16px;
}

.stats-header h3 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    color: var(--color-text);
}

.stats-grid {
    display: flex;
    justify-content: center;
    gap: 48px;
    flex-wrap: wrap;
}

.stat-item {
    display: flex;
    align-items: center;
    gap: 8px;
}

.stat-icon {
    font-size: 20px;
    line-height: 1;
}

.stat-content {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.stat-number {
    font-size: 18px;
    font-weight: 700;
    color: var(--color-accent);
    line-height: 1;
}

.stat-label {
    font-size: 11px;
    color: var(--color-text-light);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

@media (max-width: 768px) {
    .visitor-stats {
        padding: 16px;
        margin: 24px 0;
    }

    .stats-header h3 {
        font-size: 14px;
    }

    .stats-grid {
        gap: 24px;
    }

    .stat-item {
        gap: 6px;
    }

    .stat-icon {
        font-size: 18px;
    }

    .stat-number {
        font-size: 16px;
    }

    .stat-label {
        font-size: 10px;
    }
}
</style>

<script>
(function() {
    // Wait for analytics system to be ready
    function updateStatsWhenReady() {
        if (window.Analytics) {
            window.Analytics.getTotalStats();
        } else {
            setTimeout(updateStatsWhenReady, 100);
        }
    }

    // Start updating stats
    updateStatsWhenReady();

    // Update stats every 30 seconds for live feel
    setInterval(() => {
        if (window.Analytics) {
            window.Analytics.getTotalStats();
        }
    }, 30000);
})();
</script>
